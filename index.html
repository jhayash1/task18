<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">

    <title>DOM and Event handling</title>
</head>
<body>
    <header class="top">
        <h2>Hello <span class="text"></span></h2>
    </header>

    <section class="color">

        </div>
        <div class="box">
            <p>Blue</p>
        </div>
        <div class="box">
            <p>Green</p>
        </div>
        <div class="box">
            <p>Yellow</p>
        </div>

    </section>
    <section class="enter">
        <input type="text" placeholder="Enter your name">
        <button>Greet</button>
    </section>
    <script src="script.js"></script>
</body>
</html>
